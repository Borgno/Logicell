name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # Banco dos testes do Vitest e do E2E, com o usuário e a porta do docker-compose.dev.yml
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: logicell
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # O client do Prisma é gerado, não versionado: lint, typecheck, testes e build dependem dele
      - name: Prisma generate
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: API design (Spectral)
        run: bun run lint:api

      - name: Typecheck
        run: bun run typecheck && bun run typecheck:api

      - name: Test
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E
        run: bun run test:e2e
