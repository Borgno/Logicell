# Postgres local para desenvolvimento e testes. Produção sobe o seu pelo docker-compose.yml.
# Uso: bun run infra:up
name: logicell-dev

services:
  db:
    # Mesma versão maior de produção (Postgres 17).
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: logicell
    ports:
      # 5432 fica livre para outros projetos na mesma máquina.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
