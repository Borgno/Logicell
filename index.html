<!doctype html>
<html lang="pt-BR" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logicell</title>
    <!-- Ícone do site: o mesmo logo da sidebar. SVG para navegadores modernos,
         .ico (16/32/48) como fallback e PNG 180px para tela inicial no iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
    />
    <script>
      try {
        if (localStorage.getItem("logicell-theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body class="h-full bg-bg text-text antialiased overflow-hidden w-screen font-sans">
    <div id="root"></div>
    <script type="module" src="/app/main.tsx"></script>
  </body>
</html>
